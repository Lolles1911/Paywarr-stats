name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Scenarios (extension against the Tracearr stub)
        run: bash tests/run.sh

      - name: Scripts parse
        run: |
          bash -n install.sh
          for f in extensions/Others/PaywarrStats/*.php; do php -l "$f"; done
